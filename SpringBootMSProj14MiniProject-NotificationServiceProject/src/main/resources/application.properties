spring.application.name=NOTIFICATION-SERVICE
#this tells to connect to the config server which is running on the 8888 port no
spring.config.import=optional:configserver:http://localhost:8888

#Kafka broker address (where Kafka is running)
spring.kafka.bootstrap-servers=localhost:9092

#identifies consumer group
spring.kafka.consumer.group-id=notification-group


#specifying Logger File name
logging.file.name=c:/MicroServiceMiniProject/notification-service_log7.txt

#specifying the logger level as debug for com.eshwar(root package) package
logging.level.com.eshwar=DEBUG

#By default, Spring Boot exposes only a few endpoints. This property exposes all Actuator endpoints.
management.endpoints.web.exposure.include=*

#To get the Memory details using health actuator
management.endpoint.health.show-details=always

#It enables the /actuator/info endpoint to read the info.* properties
management.info.env.enabled=true

#Currect application details so that info actuator can display
info.app.name=Notification Service
info.app.description=Notification Microservice
info.app.version=1.0
info.app.author=Eshwar Reddy


#properties for Consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#When Kafka receives a JSON message, Spring Kafka converts that JSON into a Java object (like NotificationDTO).For security reasons, Spring Kafka does not trust all Java classes/packages by default.
spring.kafka.consumer.properties.spring.json.trusted.packages=*