spring.application.name=ORDER-SERVICE
#this tells to connect to the config server which is running on the 8888 port no
spring.config.import=optional:configserver:http://localhost:8888

#specifying Logger File name
logging.file.name=c:/MicroServiceMiniProject/order-service_log8.txt

#specifying the logger level as debug for com.eshwar(root package) package
logging.level.com.eshwar=DEBUG


#properties related to the circuit breaker for productService

# Percentage of failures to open the circuit
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50

# Minimum calls before calculating failure rate
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5

# Number of calls to consider
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Type of sliding window (COUNT_BASED or TIME_BASED)
resilience4j.circuitbreaker.instances.productService.sliding-window-type=COUNT_BASED

# Time circuit stays OPEN before moving to HALF-OPEN
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s

# Number of calls allowed in HALF-OPEN state
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3

# Automatically move from OPEN to HALF-OPEN
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true

