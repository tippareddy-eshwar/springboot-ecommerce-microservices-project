#By default, Spring Boot exposes only a few endpoints. This property exposes all Actuator endpoints.
management.endpoints.web.exposure.include=*

#To get the Memory details using health actuator
management.endpoint.health.show-details=always

#Kafka broker address (where Kafka is running)
spring.kafka.bootstrap-servers=localhost:9092

#specifying the topic name
app.topic.name=order-topic

#properties for producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Show error message
spring.web.error.include-message=always

# Show validation/binding errors
spring.web.error.include-binding-errors=always

# Show stack trace in the response (for debugging only)
spring.web.error.include-stacktrace=always

#This helps include the exception type in the error response.
spring.web.error.include-exception=true

#It enables the /actuator/info endpoint to read the info.* properties
management.info.env.enabled=true

#Currect application details so that info actuator can display
info.app.name=Order Service
info.app.description=Order Microservice
info.app.version=1.0
info.app.author=Eshwar Reddy

